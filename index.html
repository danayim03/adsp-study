<title>ADsP 스터디룸</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap">
<style>
/* Layout concept: a grid-paper notebook. Ink-blue for actions, highlighter yellow reserved for exam points,
   one colour per 과목. Single column of cards, quiz is one question per screen. */
:root{
  --bg:#f2f4f8; --paper:#ffffff; --paper2:#f6f8fb; --ink:#142033; --muted:#5a6779; --line:#d6dce6; --grid:rgba(20,32,51,.045);
  --accent:#2358d6; --accent-ink:#ffffff; --accent-soft:#e3ebff;
  --hi:#ffe38a; --hi-ink:#3a2c00;
  --ok:#157a4c; --ok-soft:#dff3e8; --bad:#b8322b; --bad-soft:#fbe4e2;
  --s1:#2358d6; --s2:#7a47c9; --s3:#0e8a7d;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-disp:'Noto Serif KR','Batang',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1522; --paper:#161f2e; --paper2:#1b2638; --ink:#e7edf7; --muted:#9aa8bc; --line:#2a3750; --grid:rgba(231,237,247,.045);
    --accent:#86a8ff; --accent-ink:#0b1426; --accent-soft:#1e2d52;
    --hi:#5b4a0a; --hi-ink:#ffeaa3;
    --ok:#58d49b; --ok-soft:#14352a; --bad:#ff8a82; --bad-soft:#3b1d1d;
    --s1:#86a8ff; --s2:#b99aff; --s3:#4fd3c4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1522; --paper:#161f2e; --paper2:#1b2638; --ink:#e7edf7; --muted:#9aa8bc; --line:#2a3750; --grid:rgba(231,237,247,.045);
  --accent:#86a8ff; --accent-ink:#0b1426; --accent-soft:#1e2d52;
  --hi:#5b4a0a; --hi-ink:#ffeaa3;
  --ok:#58d49b; --ok-soft:#14352a; --bad:#ff8a82; --bad-soft:#3b1d1d;
  --s1:#86a8ff; --s2:#b99aff; --s3:#4fd3c4;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; min-height:100vh;
}
.wrap{max-width:900px;margin:0 auto;padding-block:20px 56px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);line-height:1.35;margin:0;text-wrap:balance}
p{margin:0}
ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:6px}
code,pre{font-family:var(--f-mono)}
pre{margin:0;overflow-x:auto;font-size:13.5px;line-height:1.55;white-space:pre}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:18px}
.brand{background:none;border:0;padding:0;font-family:var(--f-disp);font-weight:700;font-size:19px;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:12px;height:12px;background:var(--hi);border:2px solid var(--ink)}
.tbtn{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 16px;font-weight:500;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* home */
.hero{display:flex;flex-direction:column;gap:12px;padding:8px 0 22px}
.hero h1{font-size:clamp(28px,6vw,40px)}
.hero p{color:var(--muted);max-width:60ch}
.exam{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:6px 0 16px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.actions{margin-bottom:30px}
.subj{margin-top:34px}
.subj-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.subj-h .sq{width:14px;height:14px;display:inline-block;flex:none;align-self:center}
.subj-h h2{font-size:22px}
.subj-h .mono{color:var(--muted)}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec h3{font-size:18px}
.sec .blurb{font-size:14px;color:var(--muted);flex:1}
.sec .no{color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.s1 .sq,.c1{background:var(--s1)} .s2 .sq,.c2{background:var(--s2)} .s3 .sq,.c3{background:var(--s3)}

/* section / learn */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.crumb button{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.crumb .mono{color:var(--muted)}
.sec-title{font-size:clamp(24px,5vw,32px);margin-bottom:6px}
.sec-sub{color:var(--muted);margin-bottom:16px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:500;color:var(--muted);min-height:44px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-size:12px;padding:0;color:var(--muted)}
.dot.seen{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.dot.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,4vw,26px);display:flex;flex-direction:column;gap:16px}
.card h2{font-size:clamp(21px,4.5vw,26px)}
.prompt{background:var(--paper2);border:1px dashed var(--line);border-radius:8px;padding:12px 14px}
.prompt .mono{display:block;color:var(--muted);margin-bottom:2px}
.answer{display:flex;flex-direction:column;gap:14px}
.answer li{padding-left:2px}
.tip{background:var(--hi);color:var(--hi-ink);border-radius:6px;padding:10px 14px;font-size:15px}
.tip b{font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;margin-right:8px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.finish{margin-top:18px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.finish h3{font-size:19px}

/* tools */
.tool{display:flex;flex-direction:column;gap:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input{font:inherit;font-family:var(--f-mono);color:var(--ink);background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;width:100%}
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.out{background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.out span{display:block;font-size:12.5px;color:var(--muted)}
.out b{font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted)}
.warn{color:var(--bad);font-size:14px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent)}
.tag{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:2px 8px;color:var(--muted);background:var(--paper)}
.qtext{font-size:18px;font-weight:500;line-height:1.6}
.qbox{background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:15px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;width:100%}
.opt .n{font-family:var(--f-mono);flex:none;color:var(--muted)}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.locked{cursor:default}
.fb{border-radius:10px;padding:14px 16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb strong{font-family:var(--f-disp)}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.palette button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-size:12px;padding:0}
.palette button.ans{background:var(--accent-soft);border-color:var(--accent)}
.palette button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.score{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.score b{font-family:var(--f-mono);font-size:44px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.bysubj{display:flex;flex-direction:column;gap:8px;width:100%}
.bysubj div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px;font-size:15px}
.verdict{font-weight:700}
.rv{display:flex;flex-direction:column;gap:10px}
details.r{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0}
details.r summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;list-style:none}
details.r summary::-webkit-details-marker{display:none}
details.r .mk{font-family:var(--f-mono);flex:none}
details.r.g .mk{color:var(--ok)} details.r.b .mk{color:var(--bad)}
details.r .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.cfg{display:flex;flex-direction:column;gap:16px}
.chk{display:flex;gap:10px;align-items:center;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
select{font:inherit;background:var(--paper2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px}
.foot{margin-top:44px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:20px}.tab{padding:10px 10px}}
@media (prefers-reduced-motion:no-preference){.card,.sec{transition:border-color .15s}}
</style>
<div class="wrap" id="app"></div>
<script>
const ul=(...x)=>'<ul>'+x.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
const SUBJ={1:'데이터 이해',2:'데이터 분석 기획',3:'데이터 분석'};
const SECS=[],QS=[];
function sec(id,subj,title,blurb,cards,tool){SECS.push({id,subj,title,blurb,cards,tool:tool||null});}
function qs(sid,list){list.forEach((x,i)=>QS.push({id:sid+'-'+(i+1),s:sid,t:x[0],q:x[1],box:x[2]||'',o:x[3],a:x[4],e:x[5]}));}

/* ===================== 1과목 ===================== */
sec('s1',1,'데이터와 지식','DIKW, 암묵지·형식지, SECI, 정성·정량 데이터',[
{t:'DIKW 피라미드',p:'“A마트 100원, B마트 300원”은 D·I·K·W 중 무엇일까요? “A마트가 더 싸다”는요?',
a:ul('<b>Data(데이터)</b>: 가공 전의 객관적 사실. 예) A마트 100원, B마트 300원','<b>Information(정보)</b>: 데이터를 가공해 패턴·의미를 도출. 예) A마트가 B마트보다 싸다','<b>Knowledge(지식)</b>: 정보를 구조화·연결해 예측에 쓰는 결과. 예) 상대적으로 저렴한 A마트에서 사야겠다','<b>Wisdom(지혜)</b>: 근본 원리에 대한 깊은 이해에서 나오는 창의적 아이디어. 예) 다른 상품도 A마트가 저렴할 것이다'),
tip:'숫자 그대로면 데이터, 비교·해석하면 정보, 행동 결정이면 지식, 일반화된 판단이면 지혜.'},
{t:'암묵지와 형식지',p:'자전거 타는 법과 작업 매뉴얼 중 공유하기 어려운 쪽은?',
a:ul('<b>암묵지</b>: 경험·학습으로 개인에게 체화된 지식. 공유가 어렵다. 예) 자동차 운전, 장인의 노하우, 음식 솜씨','<b>형식지</b>: 문서·매뉴얼처럼 형식화된 지식. 전달·공유가 쉽다. 예) 작업 매뉴얼, 설계서, 데이터베이스, 프로그램')},
{t:'SECI 모델',p:'암→암, 암→형, 형→형, 형→암은 각각 무슨 단계일까요?',
a:ul('<b>공통화</b>(Socialization) 암묵지→암묵지: 노하우를 타인에게 전달','<b>표출화</b>(Externalization) 암묵지→형식지: 노하우를 문서·교육 등으로 전환','<b>연결화</b>(Combination) 형식지→형식지: 기존 형식지에 새 형식지를 추가','<b>내면화</b>(Internalization) 형식지→암묵지: 형식지를 참고해 개인이 체화'),
tip:'순서는 공통화 → 표출화 → 연결화 → 내면화 (공·표·연·내).'},
{t:'정성적 데이터와 정량적 데이터',p:'주관식 설문 응답과 기온 중 정성적 데이터는?',
a:ul('<b>정성적</b>: 비정형 데이터. 저장·분석에 시간과 비용이 많이 든다. 예) 주관식 응답, 기상특보, SNS 텍스트','<b>정량적</b>: 수치 기반 정형 데이터. 대량 저장·분석이 쉽다. 예) 온도, 습도, 강수량, 풍속')},
{t:'데이터베이스의 정의와 특징',p:'데이터베이스 정의의 4요소와 4대 특징은?',
a:ul('<b>정의 4요소</b>: 통합(중복 최소화) · 저장(접근 가능한 매체) · 공용(여러 사용자 공동 이용) · 운영(조직 고유 업무에 필요)','<b>4대 특징</b>: 실시간 접근성 · 계속적인 변화(갱신·삽입·삭제) · 동시 공유 · 내용에 의한 참조(값으로 참조)')}
]);
qs('s1',[
['neg','다음 중 SECI 모델에 대한 설명으로 가장 적절하지 않은 것은?','',['공통화는 암묵지를 다른 사람의 암묵지로 전달하는 단계이다.','표출화는 암묵지를 문서나 매뉴얼 같은 형식지로 전환하는 단계이다.','연결화는 형식지를 개인이 체화하여 암묵지로 바꾸는 단계이다.','내면화는 형식지를 참고하여 개인이 노하우를 체화하는 단계이다.'],2,'연결화(Combination)는 형식지에 새로운 형식지를 더하는 형식지→형식지 단계입니다. 형식지를 암묵지로 바꾸는 것은 내면화입니다.'],
['pos','다음 중 DIKW 피라미드에서 나머지와 다른 단계에 해당하는 것은?','',['이번 달 A상점의 아메리카노 판매량은 1,200잔이다.','8월 B상점의 아메리카노 판매량은 900잔이다.','A상점의 판매량이 지난달보다 줄었다.','지난달 A상점의 아메리카노 판매량은 1,500잔이었다.'],2,'①②④는 가공 전의 사실이므로 데이터이고, ③은 두 데이터를 비교해 의미를 낸 정보입니다.'],
['pos','다음 설명에 해당하는 데이터베이스의 특징은?','사용자가 질의하면 저장된 데이터를 즉시 처리해 결과를 돌려준다.',['실시간 접근성','계속적인 변화','동시 공유','내용에 의한 참조'],0,'질의에 즉시 응답하는 성질이 실시간 접근성입니다. 계속적인 변화는 갱신·삽입·삭제로 최신 상태를 유지하는 것, 내용에 의한 참조는 위치가 아닌 값으로 찾는 것입니다.'],
['combo','정성적 데이터와 정량적 데이터에 대한 설명으로 적절한 것을 모두 고르시오.','가. 정성적 데이터는 주로 비정형이며 저장·분석에 많은 시간과 비용이 든다.<br>나. 기온·습도·강수량은 정량적 데이터이다.<br>다. 정량적 데이터는 수치 기반이어서 저장·분석이 상대적으로 어렵다.',['가','가, 나','나, 다','가, 나, 다'],1,'다가 틀립니다. 정량적 데이터는 수치 기반이라 대량 저장·분석이 쉽습니다.'],
['neg','다음 중 데이터베이스의 정의를 구성하는 요소로 보기 어려운 것은?','',['통합된 데이터','저장된 데이터','공용 데이터','암호화된 데이터'],3,'데이터베이스 정의의 4요소는 통합, 저장, 공용, 운영 데이터입니다.']
]);

sec('s2',1,'데이터 유형과 DBMS','정형·반정형·비정형, 메타데이터·인덱스, DBMS, RDBMS·NoSQL',[
{t:'데이터 유형 3가지',p:'HTML·JSON·XML은 정형일까요, 반정형일까요? 사진과 SNS 글은요?',
a:ul('<b>정형</b>: 행·열로 구성된 스프레드시트 형태. 관계형 DB, 엑셀, CSV, ERP 매출 테이블','<b>반정형</b>: 데이터 구조 정보(메타)를 함께 가지며 파싱해서 활용. HTML, XML, JSON, 웹로그, 센서 데이터','<b>비정형</b>: 형태와 구조가 없음. 사진·이미지, 영상, 소리, SNS 텍스트'),
tip:'HTML·XML·JSON은 반정형입니다. HTML을 정형으로 묻는 함정이 자주 나옵니다.'},
{t:'메타데이터와 인덱스',p:'“데이터에 대한 데이터”는? 검색을 빠르게 하는 자료 구조는?',
a:ul('<b>메타데이터</b>: 데이터에 대한 데이터. 특성, 구조, 의미, 관리 정보를 설명','<b>인덱스</b>: 데이터 검색과 정렬을 빠르게 수행하기 위한 자료 구조')},
{t:'DBMS의 장점과 단점',p:'DBMS를 쓰면 좋은 점과 나쁜 점을 각각 떠올려 보세요.',
a:ul('<b>장점</b>: 데이터 중복 최소화, 일관성·무결성 유지, 접근 권한 제어로 민감 정보 보호, SQL 기반 언어로 쉽게 제어','<b>단점</b>: 운영·보수 비용 발생, 전문 지식과 관리 필요, 시스템에 문제가 생기면 모든 데이터에 영향'),
tip:'무결성(정확성·일관성)은 DBMS의 대표적 장점으로 출제됩니다.'},
{t:'RDBMS, ODBMS, NoSQL',p:'MongoDB와 Redis는 RDBMS일까요?',
a:ul('<b>RDBMS</b>: 정형화된 테이블로 구성된 데이터 항목의 집합. MySQL, Oracle, SQL Server, DB2, PostgreSQL, Sybase','<b>ODBMS</b>: 객체지향 데이터베이스. 복잡한 데이터 구조를 객체로 표현','<b>NoSQL</b>: 관계형보다 덜 제한적인 일관성 모델. 디자인 단순화, 수평적 확장성, 세밀한 통제. MongoDB, HBase, Redis, Cassandra')}
]);
qs('s2',[
['neg','다음 중 데이터 유형 분류가 올바르지 않은 것은?','',['엑셀 매출 표 – 정형','JSON 데이터 – 반정형','SNS 게시글 – 비정형','HTML 문서 – 정형'],3,'HTML은 태그라는 구조 정보를 가진 반정형 데이터입니다.'],
['pos','데이터의 특성, 구조, 의미, 관리 정보를 설명하는 “데이터에 대한 데이터”는?','',['인덱스','메타데이터','트랜잭션','파싱'],1,'메타데이터의 정의입니다. 인덱스는 검색·정렬을 빠르게 하기 위한 자료 구조입니다.'],
['neg','다음 중 DBMS의 장단점에 대한 설명으로 적절하지 않은 것은?','',['데이터 중복을 최소화해 일관성과 무결성을 유지하는 데 유리하다.','접근 권한을 제어하여 민감한 정보를 보호할 수 있다.','시스템에 문제가 발생하면 모든 데이터에 영향을 줄 수 있다.','도입과 운영에 별도의 비용이 들지 않는다.'],3,'DBMS는 운영·보수 비용이 발생하고 전문 지식도 필요합니다.'],
['neg','다음 중 NoSQL에 대한 설명으로 적절하지 않은 것은?','',['관계형 DB보다 덜 제한적인 일관성 모델을 사용한다.','수평적 확장성이 좋다.','디자인을 단순화할 수 있다.','엄격한 테이블 스키마와 조인 연산 중심으로 설계된다.'],3,'엄격한 스키마와 조인 중심은 RDBMS의 특징입니다.'],
['neg','다음 중 관계형 데이터베이스 관리 시스템(RDBMS) 제품이 아닌 것은?','',['MySQL','Oracle','PostgreSQL','MongoDB'],3,'MongoDB는 대표적인 NoSQL 제품입니다.']
]);

sec('s3',1,'기업 솔루션과 데이터 웨어하우스','OLTP·OLAP, SCM·CRM·ERP, BI·BA·KMS·EDW, 데이터 마트',[
{t:'OLTP와 OLAP',p:'은행 거래처럼 짧고 빈번한 트랜잭션을 처리하는 시스템은?',
a:ul('<b>OLTP</b>(On-Line Transaction Processing): 온라인 거래(갱신) 처리. 컴퓨터와 연결된 사용자들의 실시간 트랜잭션 처리','<b>OLAP</b>(On-Line Analytical Processing): 온라인 분석 처리. 다차원 데이터를 대화식으로 분석하고 통계 요약 정보 제공')},
{t:'SCM, CRM, ERP',p:'공급망, 고객관계, 전사적 자원관리는 각각 어느 약자일까요?',
a:ul('<b>SCM</b>(공급망 관리): 조달→생산→물류→소비자까지 공급망 전체를 최적화. 재고·비용 절감, 납기 단축','<b>CRM</b>(고객관계 관리): 구매 상담 등 고객 이해를 바탕으로 마케팅 전략 수립. 높은 이익 창출','<b>ERP</b>(전사적 자원관리): 프로세스를 통합. 회계·인사·생산 등 기업 내부 자원 통합')},
{t:'BI, BA, KMS, EDW',p:'BI와 BA 중 더 통계·수학적 분석에 초점을 둔 것은?',
a:ul('<b>RTE</b>: 비즈니스 프로세스를 투명하게 유지, 지연시간 제거','<b>BI</b>: 데이터 웨어하우스 내 데이터에 접근해 경영 의사결정을 지원. Ad hoc Report 포함','<b>BA</b>: 통계적·수학적 분석에 초점. BI보다 진보된 형태','<b>KMS</b>: 지식관리시스템. 조직 내 지식을 체계적으로 관리','<b>EDW</b>: 여러 애플리케이션 정보를 중앙에 집중시킨 전사 데이터 웨어하우스')},
{t:'데이터 웨어하우스와 데이터 마트',p:'데이터 웨어하우스의 4대 특징은?',
a:ul('<b>4대 특징</b>: 통합성 · 시계열성 · 주제 지향성 · 비휘발성(비소멸성)','<b>데이터 마트</b>: 소규모 단일 주제의 DW. 특정 부서·업무·주제 중심','<b>종속형</b>: 중앙 DW가 존재, 하향식(Top-down), 일관성·정합성 높음','<b>독립형</b>: 중앙 DW 없음, 빠른 구축·낮은 관리 비용, 중복·불일치 우려')}
]);
qs('s3',[
['pos','다음 설명에 해당하는 시스템은?','다차원 데이터를 대화식으로 분석하고, 통계적 요약 정보를 사용자에게 제공한다.',['OLTP','OLAP','SCM','ERP'],1,'OLAP입니다. OLTP는 실시간 거래(갱신) 처리 시스템입니다.'],
['neg','다음 중 데이터 웨어하우스의 4대 특징에 해당하지 않는 것은?','',['통합성','시계열성','주제 지향성','휘발성'],3,'데이터 웨어하우스의 특징은 비휘발성(비소멸성)입니다.'],
['pos','다음 중 CRM의 목적으로 가장 적절한 것은?','',['공급망 전체의 재고와 납기를 최적화한다.','고객을 이해하고 마케팅 전략을 수립해 높은 이익을 창출한다.','회계·인사·생산 등 내부 자원을 하나의 시스템으로 통합한다.','조직 내 지식을 체계적으로 관리한다.'],1,'①은 SCM, ③은 ERP, ④는 KMS의 설명입니다.'],
['combo','데이터 마트에 대한 설명으로 올바른 것을 모두 고르시오.','가. 종속형 마트는 중앙 데이터 웨어하우스가 존재하며 하향식으로 구축된다.<br>나. 독립형 마트는 빠르게 구축할 수 있으나 데이터 중복·불일치 우려가 있다.<br>다. 데이터 마트는 전사 단위의 단일 통합 저장소이다.',['가','가, 나','나, 다','가, 나, 다'],1,'다가 틀립니다. 데이터 마트는 특정 부서·주제 중심의 소규모 DW입니다.'],
['neg','BI와 BA에 대한 설명으로 적절하지 않은 것은?','',['BI는 데이터 웨어하우스 내 데이터를 활용해 경영 의사결정에 필요한 정보를 얻는다.','BA는 통계적·수학적 분석에 초점을 둔다.','Ad hoc Report는 특정 요구에 의해 즉석에서 생성되는 보고서이다.','BA는 BI보다 단순한 형태의 분석이다.'],3,'BA는 BI보다 진보된 형태의 분석입니다.']
]);

sec('s4',1,'빅데이터 기초','3V·4V, 패러다임 변화, 데이터 단위, 비유, 3요소',[
{t:'빅데이터의 3V·4V',p:'3V를 말해 보고, 4번째 V는 무엇일까요?',
a:ul('<b>Volume</b>(양): 데이터 규모 증가','<b>Variety</b>(다양성): 정형·반정형·비정형 모두 포함','<b>Velocity</b>(속도): 빠른 생성·처리','<b>Value</b>(가치): 4V의 네 번째. 비즈니스 효과(ROI) 관점'),
tip:'Availability, Validity 같은 보기는 빅데이터의 V가 아닙니다.'},
{t:'빅데이터 패러다임 4대 변화',p:'사전→? 표본→? 질→? 인과→?',
a:ul('사전 처리 → <b>사후 처리</b>','표본조사 → <b>전수조사</b>','질 → <b>양</b>','인과관계 → <b>상관관계</b>'),
tip:'“양 → 질”로 뒤집어 묻는 문제가 자주 나옵니다. 정답은 질 → 양입니다.'},
{t:'데이터 단위',p:'KB부터 YB까지 순서를 말해 보세요. 1ZB는 몇 EB?',
a:ul('KB → MB → GB → TB → PB → EB → ZB → YB','각 단계는 1,024배(2<sup>10</sup>)','1 ZB = 1,024 EB','1 Byte = 숫자·영어·공백·특수문자(반각문자), 2 Byte = 한글·한자(전각문자)')},
{t:'빅데이터 비유와 활용 3요소',p:'석탄·철, 원유, 렌즈, 플랫폼은 각각 무엇에 빗댄 것일까요?',
a:ul('<b>석탄·철</b>: 1·2차 산업혁명의 핵심 재료','<b>원유</b>: 주요 에너지원','<b>렌즈</b>: 현미경처럼 생물학 기술 발전에 중요한 도구','<b>플랫폼</b>: 공동 활용 목적의 유·무형 구조물','<b>활용 3요소</b>: 데이터(모든 것의 데이터화) · 기술(분석·처리 기술, AI) · 인력(데이터 사이언티스트, 알고리즈미스트)')}
]);
qs('s4',[
['neg','다음 중 빅데이터의 특징(V)으로 가장 적절하지 않은 것은?','',['Volume: 기존 DB의 한계를 넘는 초대규모 데이터 양','Velocity: 실시간으로 생성되고 빠르게 처리해야 하는 속도','Variety: 정형, 반정형, 비정형을 아우르는 다양한 형태','Availability: 필요할 때 데이터에 접근할 수 있는 정도'],3,'3V는 Volume, Variety, Velocity이고 여기에 Value를 더하면 4V입니다. Availability는 해당하지 않습니다.'],
['neg','빅데이터 시대의 패러다임 변화로 올바르지 않은 것은?','',['사전 처리 → 사후 처리','표본조사 → 전수조사','양 → 질','인과관계 → 상관관계'],2,'질 → 양으로 변했습니다. 데이터가 충분히 많으면 오류에 덜 민감해집니다.'],
['pos','1ZB(제타바이트)와 같은 것은?','',['1,024 EB','1,024 PB','1,024 YB','1,000 EB'],0,'단위는 KB → MB → GB → TB → PB → EB → ZB → YB 순이며 각 1,024배입니다.'],
['pos','빅데이터에 대한 비유와 그 의미가 올바르게 짝지어진 것은?','',['석탄·철 – 1·2차 산업혁명의 핵심 재료','원유 – 현미경과 같은 중요성','렌즈 – 주요 에너지원','플랫폼 – 단일 기업 전용 폐쇄형 시스템'],0,'원유는 주요 에너지원, 렌즈는 현미경처럼 새로운 발견을 가능하게 하는 도구, 플랫폼은 공동 활용 구조물입니다.'],
['neg','다음 중 빅데이터 활용에 필요한 3요소로 보기 어려운 것은?','',['데이터','기술','인력','제도 및 법령'],3,'빅데이터 활용 3요소는 데이터, 기술, 인력입니다.']

sec('s5',1,'빅데이터 활용·위기·기술','활용 기법, 위기 요인과 통제, 비식별화, HDFS·MapReduce',[

{t:'이상값 판단과 상자그림',p:'상자그림의 이상치 경계는 어떻게 구할까요?',

{t:'요약변수·파생변수, 변수 변환',p:'Z-score와 최소-최대 정규화의 결과 범위는?',

]);

sec('s12',3,'기초 통계와 표본추출','평균·분산, 왜도·첨도, 공분산·상관, 표본추출, CLT',[
{t:'대푯값과 산포',p:'표본분산은 n으로 나눌까요, n−1로 나눌까요? 표준오차는?',
a:ul('<b>평균</b> / <b>중앙값</b>(짝수 개면 가운데 두 값의 평균) / <b>최빈값</b>(여러 개 가능)','<b>분산</b>: 편차 제곱의 평균, <b>표준편차</b> = √분산','<b>표본분산</b>: n−1로 나눔','<b>표준오차</b> = σ/√n (표본이 클수록 작아짐)')},
{t:'왜도와 첨도',p:'오른쪽으로 꼬리가 긴 분포에서 평균·중앙값·최빈값 순서는?',
a:ul('<b>왜도 > 0</b>(오른쪽 꼬리): 최빈값 < 중앙값 < 평균','<b>왜도 < 0</b>(왼쪽 꼬리): 평균 < 중앙값 < 최빈값','<b>첨도 > 0</b> 뾰족 / <b>= 0</b> 정규분포 / <b>< 0</b> 완만','적률: 1차 평균, 2차 분산, 3차 왜도, 4차 첨도'),
tip:'평균은 꼬리 방향으로 끌려갑니다.'},
{t:'공분산과 상관계수',p:'두 변수가 독립이면 공분산은? 공분산이 0이면 독립일까요?',
a:ul('<b>공분산</b>: 두 변수의 선형 관계 방향. 측정 단위의 영향을 받음','독립이면 공분산 = 0, 하지만 <b>역은 성립하지 않음</b>','<b>상관계수</b>: −1 ~ 1. 표준화되어 단위의 영향이 없음. 0은 선형 관계 없음','높은 상관이 높은 인과를 뜻하지 않음')},
{t:'표본추출 방법 4가지',p:'층화추출과 군집추출은 집단의 성질이 어떻게 다를까요?',
a:ul('<b>단순랜덤</b>: 무작위 추출','<b>계통추출</b>: 번호를 부여하고 일정 간격으로 추출','<b>층화추출</b>: 모집단을 이질적 층으로 나눈 뒤 각 층에서 무작위 추출. 집단 간 이질적, 집단 내 동질적','<b>군집추출</b>: 동질적인 집단으로 나눈 뒤 일부 집단을 선택해 조사. 집단 간 동질적, 집단 내 이질적','<b>표본오차</b>: 표본이 모집단을 대표하지 못해서 생김 / <b>비표본오차</b>: 그 외 모든 오차(표본 크기를 키워도 줄지 않을 수 있음)')},
{t:'모수·통계량, 중심극한정리',p:'중심극한정리는 모집단이 정규분포여야 성립할까요?',
a:ul('<b>모수</b>: 모집단의 특성(μ, σ²) / <b>통계량</b>: 표본의 특성(x̄, s²)','<b>CLT</b>: 모집단이 정규분포가 아니어도 표본 크기가 충분히 크면(보통 30 이상) 표본평균의 분포는 정규분포에 근사','표본평균의 기댓값 = μ, 분산 = σ²/n, 표준오차 = σ/√n','이산형·연속형 변수 모두에 적용')}
]);
qs('s12',[
['pos','오른쪽으로 꼬리가 긴(양의 왜도) 분포에서 올바른 대소 관계는?','',['평균 < 중앙값 < 최빈값','최빈값 < 중앙값 < 평균','중앙값 < 평균 < 최빈값','평균 = 중앙값 = 최빈값'],1,'평균은 꼬리 방향으로 끌려가 가장 큽니다.'],
['pos','모집단을 이질적인 층으로 나눈 뒤 각 층에서 무작위로 표본을 추출하는 방법은?','',['단순랜덤추출','계통추출','층화추출','군집추출'],2,'층화추출입니다. 계통추출은 번호를 매겨 일정 간격으로 뽑는 방법입니다.'],
['pos','군집추출에 대한 설명으로 옳은 것은?','',['집단 간에는 동질적이고 집단 내에서는 이질적이다.','집단 간에는 이질적이고 집단 내에서는 동질적이다.','번호를 매겨 일정 간격으로 추출한다.','모든 개체를 조사한다.'],0,'②는 층화추출의 설명입니다. 군집추출은 일부 집단을 선택해 그 안에서 조사합니다.'],
['neg','공분산과 상관계수에 대한 설명으로 옳지 않은 것은?','',['상관계수는 −1 이상 1 이하의 값을 가진다.','공분산은 변수의 측정 단위에 영향을 받는다.','두 변수가 독립이면 공분산은 0이다.','공분산이 0이면 두 변수는 반드시 독립이다.'],3,'독립이면 공분산이 0이지만, 공분산이 0이어도 독립이라고 단정할 수 없습니다.'],
['calc','모표준편차가 20, 표본 크기가 100일 때 표본평균의 표준오차는?','',['0.2','2','20','200'],1,'σ/√n = 20/10 = 2입니다.'],
['neg','중심극한정리에 대한 설명으로 옳지 않은 것은?','',['표본 크기가 충분히 크면 표본평균의 분포는 정규분포에 근사한다.','모집단이 정규분포일 때만 성립한다.','표본평균의 분산은 σ²/n이다.','이산형·연속형 변수 모두에 적용할 수 있다.'],1,'모집단이 정규분포가 아니어도 표본이 충분히 크면 성립하는 것이 핵심입니다.']

sec('s13',3,'확률과 확률분포','조건부·독립·배반, 베이즈, 이산·연속 분포',[
{t:'확률의 기본 용어',p:'독립 사건과 배반 사건의 곱셈·교집합 식은?',
a:ul('<b>조건부 확률</b>: P(A|B) = P(A∩B) / P(B)','<b>독립 사건</b>: P(A∩B) = P(A)·P(B), P(A|B) = P(A)','<b>배반 사건</b>: P(A∩B) = 0 (동시에 일어날 수 없음)','<b>베이즈 정리</b>: P(A|B) = P(B|A)·P(A) / P(B) (사후 = 가능도 × 사전 / 증거)'),
tip:'독립(곱이 같다)과 배반(교집합이 0)은 서로 다른 개념입니다.'},
{t:'이산확률분포',p:'기댓값이 np, 분산이 np(1−p)인 분포는? 발생 횟수 모델은?',
a:ul('<b>이산균등</b>: E = (n+1)/2','<b>베르누이</b>: E = p, V = p(1−p)','<b>이항</b>: E = np, V = np(1−p)','<b>기하</b>: 처음 성공까지 시도 횟수. E = 1/p','<b>포아송</b>: 단위 시간·공간의 발생 횟수. E = V = λ','<b>초기하</b>: 비복원 추출, 시행마다 성공확률 변함')},
{t:'연속확률분포',p:'두 집단의 분산이 같은지 검정할 때는 어느 분포?',
a:ul('<b>정규분포</b> N(μ, σ²), 표준정규 N(0,1)','<b>t분포</b>: 표본이 작고(n<30) 모분산을 모를 때, 두 집단 평균 비교','<b>카이제곱 분포</b>: 단일 모집단의 분산 검정, 적합도·독립성 검정','<b>F분포</b>: 두 집단의 분산 동일성 검정, ANOVA','<b>지수분포</b>: 사건 간 경과 시간','<b>PMF</b>: 이산, 함수값 자체가 확률 / <b>PDF</b>: 연속, 면적이 확률')}
]);

sec('s14',3,'추정과 가설검정','추정량, 신뢰구간, 가설검정, 1·2종 오류, 비모수 검정',[
{t:'점추정·구간추정과 좋은 추정량',p:'바람직한 추정량의 4가지 조건은?',
a:ul('<b>점추정</b>: 하나의 값으로 모수 추정 / <b>구간추정</b>: 모수를 포함할 구간을 확률적으로 계산','<b>불편성</b>: 추정량의 기댓값 = 모수','<b>효율성</b>: 분산이 최소','<b>일치성</b>: 표본이 커질수록 모수에 수렴','<b>충분성</b>: 모수 추정에 필요한 정보를 모두 포함')},
{t:'신뢰구간',p:'표본이 커지면 신뢰구간 폭은? 신뢰수준을 높이면?',
a:ul('x̄ ± z·σ/√n','표본 크기 n이 클수록 구간이 좁아짐(정밀해짐)','신뢰수준이 높을수록 구간이 넓어짐','z값: 90% 1.645 / 95% 1.96 / 99% 2.575','모분산을 모르면 t분포 사용 (자유도 n−1)')},
{t:'가설검정과 오류',p:'제1종 오류와 제2종 오류는 각각 무엇일까요?',
a:ul('<b>귀무가설(H0)</b>: 기존 주장, 기각의 대상 / <b>대립가설(H1)</b>: 입증하려는 주장','<b>유의수준 α</b>: 제1종 오류를 범할 최대 허용 한계(보통 0.05)','<b>p-value < α</b> → 귀무가설 기각','<b>제1종 오류</b>: H0이 참인데 기각 (α)','<b>제2종 오류</b>: H0이 거짓인데 채택 (β). 검정력 = 1 − β'),

{t:'모수·비모수 검정과 카이제곱 자유도',p:'t검정은 모수 검정일까요?',

sec('s15',3,'회귀분석','가정, 최소제곱법, R², 규제, 변수 선택, 평가 지표',[
{t:'회귀분석의 가정',p:'회귀분석 5가지 가정을 떠올려 보세요.',
a:ul('<b>선형성</b>: 독립변수와 종속변수가 선형','<b>독립성</b>: <b>오차 간</b> 상관이 없음 (Durbin-Watson)','<b>정규성</b>: 오차가 정규분포 (Q-Q plot, Shapiro-Wilk)','<b>등분산성</b>: 오차의 분산이 일정','<b>비상관성</b>: 오차끼리 상관 없음','명목형 변수는 더미변수로 변환'),
tip:'“독립성”은 독립변수끼리가 아니라 오차끼리의 독립입니다.'},
{t:'최소제곱법과 결정계수',p:'R²는 어떻게 계산할까요? 수정 R²는 왜 쓸까요?',
a:ul('<b>OLS</b>: 잔차제곱합(SSE)이 최소가 되는 직선','<b>SST = SSR + SSE</b> / <b>R² = SSR/SST = 1 − SSE/SST</b> (0~1)','단순선형회귀에서 R² = r² (상관계수의 제곱)','<b>수정 R²</b>: 독립변수 수를 고려해 보정. 변수가 늘었다고 무조건 증가하지 않음','절편 포함 OLS에서는 잔차의 합과 평균이 항상 0')},
{t:'회귀 종류와 규제(라쏘·릿지)',p:'일부 계수를 정확히 0으로 만드는 것은?',
a:ul('단순회귀 / 다중회귀 / 다항회귀','<b>라쏘</b>(L1): 가중치 절댓값 합에 패널티. 일부 계수를 0으로 → 변수 선택','<b>릿지</b>(L2): 가중치 제곱합에 패널티. 계수를 0에 가깝게 하지만 0으로 만들지는 않음. 다중공선성 완화','<b>엘라스틱넷</b>: L1 + L2')},
{t:'모형 검정과 ANOVA',p:'회귀계수 t검정의 귀무가설은? 잔차 자유도는?',
a:ul('절차: ① 변수 설정 → ② 계수 추정 → ③ 계수 유의성(t검정 p<0.05) → ④ 모형 유의성(F검정) → ⑤ 결정계수','<b>t검정</b> H0: β = 0, H1: β ≠ 0','<b>F = MSR/MSE</b>, 자유도: 회귀 k, 잔차 n−k−1, 전체 n−1','다중회귀 잔차 자유도 = n − k − 1 (k는 독립변수 수)')},
{t:'평가 지표와 변수 선택',p:'MAE, MSE, RMSE, MAPE의 차이는?',
a:ul('<b>MAE</b>: 절댓값 오차의 평균','<b>MSE</b>: 제곱 오차의 평균 (큰 오차에 큰 패널티)','<b>RMSE</b>: MSE의 제곱근 (원래 단위로 해석)','<b>MAPE</b>: 절대 백분율 오차의 평균','<b>전진선택</b>: 하나씩 추가 / <b>후진제거</b>: 모두 넣고 하나씩 제거 / <b>단계별</b>: 추가·제거 반복 (AIC, BIC)')}
]);

sec('s18',3,'분류: 로지스틱·의사결정나무·앙상블','오즈·로짓, 지니·엔트로피, CART·C4.5·CHAID, 배깅·부스팅, k-NN',[
{t:'로지스틱 회귀와 오즈',p:'x가 1 증가하면 로짓과 오즈는 각각 어떻게 변할까요?',
a:ul('종속변수가 이항 범주(0/1)일 때 사용. 계수는 최대우도법으로 추정','<b>오즈</b> = P/(1−P), <b>로짓</b> = ln(오즈) = β₀ + β₁x','x가 1 증가 → 로짓은 β₁ 증가, <b>오즈는 e<sup>β₁</sup>배</b> (exp(β) = 오즈비)','시그모이드 함수 1/(1+e<sup>−z</sup>)로 확률(0~1) 변환','오즈비 OR = (a/b)/(c/d), 상대위험도 RR = (a/(a+b))/(c/(c+d))')},
{t:'의사결정나무',p:'CART, C4.5, CHAID가 사용하는 분리 기준은?',
a:ul('<b>CART</b>: 지니 지수(분류), 분산 감소량(회귀)','<b>C4.5/C5.0</b>: 엔트로피 지수','<b>CHAID</b>: 카이제곱 통계량(분류), ANOVA F통계량(회귀)','<b>지니</b> = 1 − ΣPᵢ² / <b>엔트로피</b> = −ΣPᵢ·log₂Pᵢ','<b>가지치기</b>: 과대적합 방지, 일반화 성능 향상','장점: 해석 용이 / 단점: 과대적합 가능, 경계 부근 오차')},
{t:'앙상블',p:'배깅과 부스팅의 핵심 차이는?',
a:ul('<b>배깅</b>: 부트스트랩으로 여러 표본을 만들어 병렬 학습 후 집계. 분산 감소','<b>부스팅</b>: 오분류 데이터에 가중치를 주며 순차 학습. AdaBoost, GBM, XGBoost, LightGBM','<b>랜덤포레스트</b>: 배깅 + 변수 무작위 선택. 이상치에 강건','<b>스태킹</b>: 개별 모델의 예측을 메타 모델에 입력','<b>보팅</b>: 여러 모델의 결과를 투표로 결정')},
{t:'k-NN',p:'k가 아주 작으면 어떤 문제가 생길까요?',
a:ul('가까운 k개 이웃의 다수결로 분류하는 거리 기반 지도학습','사전 학습이 없는 lazy 방식','<b>k가 작으면 과대적합, k가 크면 과소적합</b>')}
]);

sec('s19',3,'인공신경망과 SVM','활성화 함수, 기울기 소실, 과적합 방지, SVM',[
{t:'인공신경망',p:'인공신경망의 대표적 단점 두 가지는?',

sec('s20',3,'모델 평가와 과적합','과대·과소적합, 데이터 분할, 교차검증, 오분류표, ROC',[
{t:'과대적합과 과소적합',p:'과대적합일 때 훈련 오차와 검증 오차는?',
a:ul('<b>과대적합</b>: 훈련 데이터를 과도하게 학습. 낮은 편향·<b>높은 분산</b>. 훈련 오차↓ 검증 오차↑. 대책: 규제 추가, 복잡도 낮춤','<b>과소적합</b>: 패턴을 충분히 학습 못함. <b>높은 편향</b>·낮은 분산. 훈련·검증 오차 모두 높음. 대책: 규제 완화, 복잡도 높임','일반화: 학습에 쓰이지 않은 새 데이터에서도 안정적으로 좋은 성능')},
{t:'데이터 분할과 교차검증',p:'부트스트랩에서 한 번도 뽑히지 않을 확률은?',
a:ul('훈련(약 50%) · 검증(약 30%) · 평가(약 20%)','<b>홀드아웃</b>: 훈련/평가 데이터는 서로 중복 불가','<b>K-fold</b>: k개 집단으로 나눠 k번 검증','<b>LOOCV</b>: 1개만 검증, 나머지 n−1개로 학습','<b>부트스트랩</b>: 복원추출. 한 번도 안 뽑힐 확률 (1−1/n)<sup>n</sup> ≈ 36.8%, 훈련용 약 63.2%','시계열은 시간 순서를 유지해야 함 (data leakage 주의)')},
{t:'오분류표와 평가 지표',p:'정밀도와 재현율은 분모가 어떻게 다를까요?',
a:ul('TP, FP, FN, TN','<b>정확도</b> = (TP+TN)/전체','<b>정밀도</b> = TP/(TP+FP) — 양성이라 예측한 것 중 실제 양성','<b>재현율(민감도)</b> = TP/(TP+FN) — 실제 양성 중 예측 성공','<b>특이도</b> = TN/(TN+FP)','<b>F1</b> = 2·정밀도·재현율/(정밀도+재현율)','<b>오분류율</b> = 1 − 정확도')},
{t:'ROC 곡선과 향상도',p:'ROC에서 가장 이상적인 점의 좌표는?',
a:ul('<b>ROC</b>: x축 FPR(1−특이도), y축 TPR(민감도)','이상적 모델은 좌상단 <b>(0, 1)</b>에 가까움, AUC가 1에 가까울수록 좋음','<b>향상도 곡선·이익도표</b>: 등급별 반응률·향상도를 보며 분류 모형의 예측력 평가')}
],'cm');

/* ===================== app ===================== */
(function(){
'use strict';
const KEY='adsp-study-v1';
const $app=document.getElementById('app');
const CIRC=['①','②','③','④'];
const TYPE_LABEL={pos:'단일 선택',neg:'부적절한 것 고르기',combo:'가·나·다 조합',calc:'계산',code:'R 출력 해석'};

let store={learned:{},seen:{},best:{},done:{},wrong:{},theme:''};
try{
  const raw=localStorage.getItem(KEY);
  if(raw){const o=JSON.parse(raw); if(o&&typeof o==='object'){for(const k in o){store[k]=o[k];}}}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function applyTheme(){const r=document.documentElement; if(store.theme){r.setAttribute('data-theme',store.theme);}else{r.removeAttribute('data-theme');}}
applyTheme();

const secById={}, qBySec={}, qById={}, secIdx={};
const cnt={1:0,2:0,3:0};
SECS.forEach(s=>{secById[s.id]=s; cnt[s.subj]++; secIdx[s.id]=s.subj+'-'+cnt[s.subj];});
QS.forEach(q=>{qById[q.id]=q; (qBySec[q.s]=qBySec[q.s]||[]).push(q);});

let view={name:'home'};
let learnSt={};
let Q=null;
let timer=null;

function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t;} return a;}
function steps(s){return s.cards.length+(s.tool?1:0);}
function fmtTime(ms){ms=Math.max(0,ms); const s=Math.floor(ms/1000); const m=Math.floor(s/60); const r=s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');}
function lst(id){return learnSt[id]||(learnSt[id]={i:0,rev:{}});}
function markSeen(sid,i){
  const arr=store.seen[sid]||(store.seen[sid]=[]);
  if(arr.indexOf(i)<0){arr.push(i);}
  if(arr.length>=steps(secById[sid])){store.learned[sid]=true;}
  save();
}

/* ---------- routing ---------- */
function go(name,params){
  view=Object.assign({name:name},params||{});
  if(!(name==='quiz'&&Q&&Q.mode==='mock'&&!Q.finished)){stopTimer();}
  render();
  window.scrollTo(0,0);
}
function stopTimer(){if(timer){clearInterval(timer); timer=null;}}
function startTimer(){
  if(timer) return;
  timer=setInterval(function(){
    if(!Q||Q.mode!=='mock'||Q.finished){stopTimer(); return;}
    const left=Q.deadline-Date.now();
    if(left<=0){finishQuiz(); return;}
    const el=document.getElementById('timer'); if(el){el.textContent=fmtTime(left);}
  },1000);
}

/* ---------- views ---------- */
function topbar(){
  const lab=store.theme==='dark'?'Dark':store.theme==='light'?'Light':'Auto';
  return '<div class="topbar"><button class="brand" data-act="home"><i></i>ADsP 스터디룸</button><button class="tbtn" data-act="theme">Theme: '+lab+'</button></div>';
}
function foot(){
  return '<div class="foot">개인 학습용입니다. 꿈꾸는라이언 「데이터분석 준전문가 핵심 요약노트」를 단원별로 재구성했고, 문제는 기출 복원 후기의 출제 경향(부적절한 것 고르기, 가·나·다 조합, 계산, R 출력 해석)을 참고해 새로 만들었습니다. 최종 확인은 공식 교재와 기출로 하세요.</div>';
}

function secCard(s){
  const n=(qBySec[s.id]||[]).length, seen=(store.seen[s.id]||[]).length, st=steps(s);
  const b=store.best[s.id];
  const p1=store.learned[s.id]?'<span class="pill ok">Learned</span>':'<span class="pill">'+seen+'/'+st+' cards</span>';
  const p2=(b!=null)?'<span class="pill'+(b>=80?' ok':'')+'">Best '+b+'%</span>':'<span class="pill">'+n+' questions</span>';
  return '<article class="sec"><div class="mono no">'+secIdx[s.id]+'</div><h3>'+s.title+'</h3><p class="blurb">'+s.blurb+'</p><div class="pills">'+p1+p2+'</div>'
    +'<div class="row"><button class="btn btn-ghost" data-act="learn" data-sid="'+s.id+'">Learn</button><button class="btn btn-primary" data-act="quiz" data-sid="'+s.id+'">Quiz</button></div></article>';
}

function homeView(){
  const learned=SECS.filter(s=>store.learned[s.id]).length;
  const doneIds=Object.keys(store.done).filter(id=>qById[id]);
  const correct=doneIds.filter(id=>store.done[id]).length;
  const acc=doneIds.length?Math.round(correct/doneIds.length*100)+'%':'–';
  const wrongN=Object.keys(store.wrong).filter(id=>qById[id]).length;
  let h=topbar();
  h+='<section class="hero"><h1>ADsP 스터디룸</h1><p>데이터분석 준전문가 핵심요약노트를 작은 단원으로 나눴습니다. 개념을 먼저 떠올려 보고, 단원마다 퀴즈로 바로 확인하세요. 퀴즈는 단원을 끝내지 않아도 언제든 풀 수 있습니다.</p>'
    +'<div class="exam">50문항 · 90분 · 1과목 10 / 2과목 10 / 3과목 30 · 총점 60점 이상, 과목별 40% 미만 과락</div></section>';
  h+='<div class="stats"><div class="stat"><b>'+learned+'/'+SECS.length+'</b><span>단원 학습</span></div><div class="stat"><b>'+doneIds.length+'/'+QS.length+'</b><span>푼 문제</span></div><div class="stat"><b>'+acc+'</b><span>정답률</span></div></div>';
  h+='<div class="row actions"><button class="btn btn-primary" data-act="mix">Mixed quiz</button><button class="btn" data-act="mockintro">Mock exam (50)</button>'
    +'<button class="btn" data-act="wrongreview" '+(wrongN?'':'aria-disabled="true"')+'>Review mistakes ('+wrongN+')</button></div>';
  [1,2,3].forEach(function(n){
    const list=SECS.filter(s=>s.subj===n);
    const qn=list.reduce((a,s)=>a+(qBySec[s.id]||[]).length,0);
    h+='<section class="subj s'+n+'"><div class="subj-h"><span class="sq"></span><h2>'+n+'과목 · '+SUBJ[n]+'</h2><span class="mono">'+list.length+' sections · '+qn+' questions</span></div><div class="secs">'+list.map(secCard).join('')+'</div></section>';
  });
  return h+foot();
}

/* ----- tools ----- */
function toolHtml(kind){
  if(kind==='cm'){
    return '<div class="tool"><p class="note">오분류표의 네 칸 값을 바꿔 보며 지표가 어떻게 변하는지 확인하세요. (예시: TP 40, FP 10, FN 20, TN 30)</p>'
    +'<div class="fields"><label class="field">TP (참 양성)<input id="cm-tp" type="number" min="0" value="40"></label><label class="field">FP (거짓 양성)<input id="cm-fp" type="number" min="0" value="10"></label><label class="field">FN (거짓 음성)<input id="cm-fn" type="number" min="0" value="20"></label><label class="field">TN (참 음성)<input id="cm-tn" type="number" min="0" value="30"></label></div>'
    +'<div class="outs" id="tool-out"></div></div>';
  }
  return '<div class="tool"><p class="note">거래 건수를 바꿔 지지도·신뢰도·향상도를 확인하세요. 규칙은 A → B 입니다. (예시: 전체 100, A 40, B 30, A와 B 동시 20)</p>'
    +'<div class="fields"><label class="field">전체 거래 수<input id="as-t" type="number" min="1" value="100"></label><label class="field">A 포함 거래 수<input id="as-a" type="number" min="0" value="40"></label><label class="field">B 포함 거래 수<input id="as-b" type="number" min="0" value="30"></label><label class="field">A, B 동시 거래 수<input id="as-ab" type="number" min="0" value="20"></label></div>'
    +'<div class="outs" id="tool-out"></div></div>';
}
function pct(v){return (v==null||!isFinite(v))?'–':(v*100).toFixed(1)+'%';}
function out(label,val){return '<div class="out"><span>'+label+'</span><b>'+val+'</b></div>';}
function calcTool(){
  const box=document.getElementById('tool-out'); if(!box) return;
  const num=function(id){const el=document.getElementById(id); return el?(parseFloat(el.value)||0):0;};
  if(document.getElementById('cm-tp')){
    const tp=num('cm-tp'),fp=num('cm-fp'),fn=num('cm-fn'),tn=num('cm-tn'),tot=tp+fp+fn+tn;
    const r=function(a,b){return b>0?a/b:null;};
    const P=r(tp,tp+fp), R=r(tp,tp+fn), acc=r(tp+tn,tot);
    const f1=(P!=null&&R!=null&&(P+R)>0)?2*P*R/(P+R):null;
    box.innerHTML=out('정확도 (TP+TN)/전체',pct(acc))+out('정밀도 TP/(TP+FP)',pct(P))+out('재현율 TP/(TP+FN)',pct(R))+out('특이도 TN/(TN+FP)',pct(r(tn,tn+fp)))+out('F1',pct(f1))+out('오분류율',acc==null?'–':pct(1-acc));
  }else if(document.getElementById('as-t')){
    const t=num('as-t'),a=num('as-a'),b=num('as-b'),ab=num('as-ab');
    if(t<=0||a<=0||b<=0||a>t||b>t||ab>a||ab>b){
      box.innerHTML='<p class="warn">입력을 확인하세요. 0 < A, B ≤ 전체, 그리고 동시 거래 수 ≤ min(A, B) 이어야 합니다.</p>'; return;
    }
    const sup=ab/t, conf=ab/a, lift=conf/(b/t);
    const note=Math.abs(lift-1)<0.005?'독립':(lift>1?'양의 상관':'음의 상관');
    box.innerHTML=out('지지도 P(A∩B)',sup.toFixed(3))+out('신뢰도 P(B|A)',conf.toFixed(3))+out('향상도',lift.toFixed(2))+out('해석',note);
  }
}

/* ----- learn ----- */
function learnView(){
  const s=secById[view.sid], L=lst(s.id), st=steps(s);
  const i=Math.min(L.i,st-1);
  const seen=store.seen[s.id]||[];
  const idx=SECS.indexOf(s);
  let h=topbar();
  h+='<div class="crumb"><button data-act="home">All sections</button><span class="mono">/ '+secIdx[s.id]+' · '+SUBJ[s.subj]+'</span></div>';
  h+='<h1 class="sec-title">'+s.title+'</h1><p class="sec-sub">'+s.blurb+'</p>';
  h+='<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true">Learn</button><button class="tab" role="tab" aria-selected="false" data-act="quiz" data-sid="'+s.id+'">Quiz ('+(qBySec[s.id]||[]).length+')</button></div>';
  h+='<div class="dots">';
  for(let k=0;k<st;k++){h+='<button class="dot'+(k===i?' cur':(seen.indexOf(k)>=0?' seen':''))+'" data-act="step" data-i="'+k+'" aria-label="Step '+(k+1)+'">'+(k+1)+'</button>';}
  h+='</div>';
  if(i<s.cards.length){
    const c=s.cards[i], rev=L.rev[i];
    h+='<div class="card"><h2>'+c.t+'</h2><div class="prompt"><span class="mono">TRY TO RECALL</span>'+c.p+'</div>';
    if(rev){
      h+='<div class="answer">'+c.a+(c.tip?'<div class="tip"><b>EXAM POINT</b>'+c.tip+'</div>':'')+'</div>';
    }else{
      h+='<div><button class="btn btn-primary" data-act="reveal">Show answer</button></div>';
    }
    h+='</div>';
  }else{
    h+='<div class="card"><h2>직접 계산해 보기</h2>'+toolHtml(s.tool)+'</div>';
  }
  h+='<div class="nav"><button class="btn" data-act="lprev" '+(i===0?'aria-disabled="true"':'')+'>← Previous</button>';
  if(i<st-1){h+='<button class="btn btn-primary" data-act="lnext">Next →</button>';}
  h+='</div>';
  if(i===st-1){
    const nx=SECS[idx+1];
    h+='<div class="finish"><h3>이 단원 퀴즈로 확인해 볼까요?</h3><p class="note">'+(qBySec[s.id]||[]).length+'문제입니다. 틀린 문제는 Review mistakes에 모입니다.</p><div class="row"><button class="btn btn-primary" data-act="quiz" data-sid="'+s.id+'">Start quiz</button>'
      +(nx?'<button class="btn" data-act="learn" data-sid="'+nx.id+'">Next section: '+nx.title+'</button>':'')+'<button class="btn btn-ghost" data-act="home">All sections</button></div></div>';
  }
  return h+foot();
}

/* ----- quiz ----- */
function startQuiz(list,opts){
  Q=Object.assign({list:list,i:0,ans:list.map(function(){return -1;}),locked:list.map(function(){return false;}),finished:false,mode:'practice',title:'Quiz',back:{name:'home'}},opts||{});
  stopTimer();
  if(Q.mode==='mock'){Q.deadline=Date.now()+90*60*1000;}
  go('quiz');
}
function backBtn(){return '<button class="btn btn-ghost" data-act="qquit">'+(Q.mode==='mock'?'Quit exam':'Quit')+'</button>';}

function questionView(){
  const q=Q.list[Q.i], n=Q.list.length, mock=Q.mode==='mock';
  const sel=Q.ans[Q.i], locked=Q.locked[Q.i];
  let h=topbar();
  h+='<div class="qhead"><span class="mono">'+Q.title+'</span><span class="row" style="align-items:center">'+(mock?'<span class="timer" id="timer">'+fmtTime(Q.deadline-Date.now())+'</span>':'')
    +'<span class="tag">'+SUBJ[secById[q.s].subj]+'</span><span class="tag">'+TYPE_LABEL[q.t]+'</span></span></div>';
  h+='<div class="bar"><i style="width:'+Math.round((Q.i+(locked||(mock&&sel>=0)?1:0))/n*100)+'%"></i></div>';
  h+='<div class="card"><div class="mono">Q '+(Q.i+1)+' / '+n+'</div><div class="qtext">'+q.q+'</div>'+(q.box?'<div class="qbox">'+q.box+'</div>':'')+'<div class="opts">';
  q.o.forEach(function(o,k){
    let cls='';
    if(mock){if(sel===k)cls=' sel';}
    else if(locked){cls=' locked'+(k===q.a?' good':(k===sel?' bad':''));}
    h+='<button class="opt'+cls+'" data-act="pick" data-k="'+k+'"><span class="n">'+CIRC[k]+'</span><span class="t">'+o+'</span></button>';
  });
  h+='</div>';
  if(!mock&&locked){
    const ok=sel===q.a;
    h+='<div class="fb '+(ok?'good':'bad')+'"><strong>'+(ok?'정답입니다':'오답입니다. 정답은 '+CIRC[q.a]+'번')+'</strong><div>'+q.e+'</div></div>';
  }
  h+='</div>';
  if(mock){
    h+='<div class="palette">';
    for(let k=0;k<n;k++){h+='<button data-act="qjump" data-i="'+k+'" class="'+(k===Q.i?'cur':(Q.ans[k]>=0?'ans':''))+'" aria-label="Question '+(k+1)+'">'+(k+1)+'</button>';}
    h+='</div>';
    const answered=Q.ans.filter(function(a){return a>=0;}).length;
    h+='<div class="nav"><div class="row">'+backBtn()+'<button class="btn" data-act="qprev" '+(Q.i===0?'aria-disabled="true"':'')+'>← Prev</button></div><div class="row">'
      +(Q.i<n-1?'<button class="btn btn-primary" data-act="qnext">Next →</button>':'')+'<button class="btn '+(Q.i===n-1?'btn-primary':'')+'" data-act="submit">Submit ('+answered+'/'+n+')</button></div></div>';
  }else{
    h+='<div class="nav">'+backBtn()+(locked?'<button class="btn btn-primary" data-act="qnext">'+(Q.i<n-1?'Next →':'See results')+'</button>':'<button class="btn btn-ghost" data-act="qnext">Skip →</button>')+'</div>';
  }
  return h+foot();
}

function resultView(){
  const n=Q.list.length;
  let c=0; const by={};
  Q.list.forEach(function(q,i){
    const ok=Q.ans[i]===q.a; if(ok)c++;
    const sj=secById[q.s].subj; by[sj]=by[sj]||{c:0,n:0}; by[sj].n++; if(ok)by[sj].c++;
  });
  const p=Math.round(c/n*100);
  let h=topbar();
  h+='<div class="crumb"><span class="mono">'+Q.title+' · Results</span></div>';
  h+='<div class="card"><div class="score"><span class="mono">SCORE</span><b>'+c+' / '+n+'</b><span>'+p+'%</span></div>';
  const keys=Object.keys(by);
  if(keys.length>1||Q.mode==='mock'){
    h+='<div class="bysubj">'+keys.map(function(k){const b=by[k]; const bp=Math.round(b.c/b.n*100); return '<div><span>'+k+'과목 · '+SUBJ[k]+'</span><span class="mono">'+b.c+'/'+b.n+' ('+bp+'%)</span></div>';}).join('')+'</div>';
  }
  if(Q.mode==='mock'){
    let low=[]; keys.forEach(function(k){if(by[k].c/by[k].n<0.4)low.push(k+'과목');});
    const pass=p>=60&&!low.length;
    h+='<p class="verdict" style="color:var(--'+(pass?'ok':'bad')+')">'+(pass?'합격 기준 충족 (연습 기준)':(low.length?'과락 발생: '+low.join(', '):'총점 60점 미만'))+'</p><p class="note">실제 시험은 총점 60점 이상이고 과목별 40% 미만이면 과락입니다. 이 결과는 연습용 추정입니다.</p>';
  }
  const wrong=[]; Q.list.forEach(function(q,i){if(Q.ans[i]!==q.a)wrong.push(q);});
  h+='<div class="row"><button class="btn btn-primary" data-act="retry">Try again</button>'+(wrong.length?'<button class="btn" data-act="retrywrong">Retry mistakes ('+wrong.length+')</button>':'')+'<button class="btn btn-ghost" data-act="qquit">Back</button></div></div>';
  h+='<h2 style="margin:26px 0 12px;font-size:20px">Review</h2><div class="rv">';
  Q.list.forEach(function(q,i){
    const ok=Q.ans[i]===q.a, sel=Q.ans[i];
    h+='<details class="r '+(ok?'g':'b')+'"><summary><span class="mk">'+(ok?'O':'X')+'</span><span>'+(i+1)+'. '+q.q+'</span></summary><div class="body">'
      +(q.box?'<div class="qbox">'+q.box+'</div>':'')
      +'<div>내 답: '+(sel>=0?CIRC[sel]+' '+q.o[sel]:'—')+'</div><div>정답: '+CIRC[q.a]+' '+q.o[q.a]+'</div><div class="prompt">'+q.e+'</div></div></details>';
  });
  h+='</div>';
  return h+foot();
}

function quizView(){return Q.finished?resultView():questionView();}

function finishQuiz(){
  if(!Q||Q.finished) return;
  Q.finished=true; stopTimer();
  if(Q.mode==='mock'){
    Q.list.forEach(function(q,i){
      if(Q.ans[i]<0) return;
      const ok=Q.ans[i]===q.a; store.done[q.id]=ok;
      if(ok){delete store.wrong[q.id];}else{store.wrong[q.id]=true;}
    });
  }
  if(Q.secId&&Q.list.length===(qBySec[Q.secId]||[]).length){
    let c=0; Q.list.forEach(function(q,i){if(Q.ans[i]===q.a)c++;});
    const p=Math.round(c/Q.list.length*100);
    if(store.best[Q.secId]==null||p>store.best[Q.secId]){store.best[Q.secId]=p;}
  }
  save(); render(); window.scrollTo(0,0);
}

    +'<div class="row"><button class="btn btn-primary" data-act="mockstart">Start exam</button><button class="btn btn-ghost" data-act="home">Cancel</button></div></div>';
  return h+foot();

function buildMix(subjs,n){
  const pool=QS.filter(function(q){return subjs.indexOf(secById[q.s].subj)>=0;});
  const w=function(q){return (store.wrong[q.id]?0:(store.done[q.id]===undefined?1:2))+Math.random()*0.9;};
  const picked=pool.map(function(q){return {q:q,w:w(q)};}).sort(function(a,b){return a.w-b.w;}).slice(0,n).map(function(x){return x.q;});
  return shuffle(picked);
}
function buildMock(){
  let out=[];
  [[1,10],[2,10],[3,30]].forEach(function(g){
    const pool=shuffle(QS.filter(function(q){return secById[q.s].subj===g[0];}));
    out=out.concat(pool.slice(0,g[1]));
  });
  return out;
}

/* ---------- render ---------- */
function render(){
  let h='';
  switch(view.name){
    case 'learn': h=learnView(); break;
    case 'quiz': h=quizView(); break;
    case 'mix': h=mixView(); break;
    case 'mockintro': h=mockIntroView(); break;
    default: h=homeView();
  }
  $app.innerHTML=h;
  if(view.name==='quiz'&&Q&&Q.mode==='mock'&&!Q.finished){startTimer();}
  calcTool();
}

/* ---------- events ---------- */
$app.addEventListener('click',function(e){
  const t=e.target.closest('[data-act]'); if(!t) return;
  if(t.getAttribute('aria-disabled')==='true') return;
  const a=t.dataset.act;
  switch(a){
    case 'home': go('home'); break;
    case 'theme': store.theme=store.theme===''?'dark':(store.theme==='dark'?'light':''); applyTheme(); save(); render(); break;
    case 'learn': go('learn',{sid:t.dataset.sid}); break;
    case 'quiz': {
      const sid=t.dataset.sid;
      startQuiz((qBySec[sid]||[]).slice(),{title:secIdx[sid]+' '+secById[sid].title,secId:sid,back:(view.name==='learn'?{name:'learn',sid:sid}:{name:'home'})});
      break;
    }
    case 'reveal': {const L=lst(view.sid); L.rev[L.i]=true; markSeen(view.sid,L.i); render(); break;}
    case 'step': {const L=lst(view.sid); L.i=parseInt(t.dataset.i,10); if(L.i>=secById[view.sid].cards.length){markSeen(view.sid,L.i);} render(); break;}
    case 'lprev': {const L=lst(view.sid); if(L.i>0){L.i--; render();} break;}
    case 'lnext': {
      const L=lst(view.sid); const s=secById[view.sid];
      if(L.i<steps(s)-1){L.i++; if(L.i>=s.cards.length){markSeen(view.sid,L.i);} render();}
      break;
    }
    case 'pick': {
      if(!Q||Q.finished) break;
      const k=parseInt(t.dataset.k,10), i=Q.i, q=Q.list[i];
      if(Q.mode==='mock'){Q.ans[i]=k; render(); break;}
      if(Q.locked[i]) break;
      Q.ans[i]=k; Q.locked[i]=true;
      const ok=(k===q.a); store.done[q.id]=ok;
      if(ok){delete store.wrong[q.id];}else{store.wrong[q.id]=true;}
      save(); render(); break;
    }
    case 'qnext': if(Q.i<Q.list.length-1){Q.i++; render(); window.scrollTo(0,0);}else{finishQuiz();} break;
    case 'qprev': if(Q.i>0){Q.i--; render(); window.scrollTo(0,0);} break;
    case 'qjump': Q.i=parseInt(t.dataset.i,10); render(); window.scrollTo(0,0); break;
    case 'submit': finishQuiz(); break;
    case 'qquit': {const b=Q?Q.back:{name:'home'}; stopTimer(); go(b.name,b); break;}
    case 'retry': startQuiz(Q.list.slice(),{title:Q.title,secId:Q.secId,mode:Q.mode,back:Q.back}); break;
    case 'retrywrong': {
      const w=Q.list.filter(function(q,i){return Q.ans[i]!==q.a;});
      startQuiz(w,{title:Q.title+' · mistakes',back:Q.back}); break;
    }
    case 'mix': go('mix'); break;
    case 'mixstart': {
      const subs=[1,2,3].filter(function(n){const el=document.getElementById('mx-'+n); return el&&el.checked;});
      if(!subs.length) break;
      const n=parseInt(document.getElementById('mx-n').value,10)||10;
      startQuiz(buildMix(subs,n),{title:'Mixed quiz',back:{name:'home'}}); break;
    }
    case 'mockintro': go('mockintro'); break;
    case 'mockstart': startQuiz(buildMock(),{title:'Mock exam',mode:'mock',back:{name:'home'}}); break;
    case 'wrongreview': {
      const list=Object.keys(store.wrong).map(function(id){return qById[id];}).filter(Boolean);
      if(list.length){startQuiz(shuffle(list),{title:'Review mistakes',back:{name:'home'}});}
      break;
    }
  }
});
$app.addEventListener('input',function(e){
  const id=e.target&&e.target.id;
  if(id&&(id.indexOf('cm-')===0||id.indexOf('as-')===0)){calcTool();}
});

render();
})();
</script>
